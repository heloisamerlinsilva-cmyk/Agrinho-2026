<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="agrinho, sustentabilidade, quiz, educação">
    <title>Quiz Sustentável - Agrinho 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>EcoQuiz: Sustentabilidade no Dia a Dia</h1>
        <p>Aprenda e teste seus conhecimentos sobre o meio ambiente!</p>
    </header>

    <main>
        <section id="start-screen" class="quiz-container">
            <h2>Bem-vindo(a)!</h2>
            <form id="user-form">
                <label for="username">Digite seu nome para começar:</label>
                <input type="text" id="username" required placeholder="Ex: Maria Silva">
                <button type="submit" id="btn-start">Iniciar Quiz</button>
            </form>
        </section>

        <section id="quiz-screen" class="quiz-container hidden">
            <div id="question-container">
                <h2 id="question-text">Pergunta aqui</h2>
                <div id="options-container">
                    </div>
            </div>
            <div id="feedback" class="hidden"></div>
            <button id="btn-next" class="hidden">Próxima Pergunta</button>
        </section>

        <section id="result-screen" class="quiz-container hidden">
            <h2>Resultado Final</h2>
            <p id="result-text"></p>
            <button id="btn-restart">Jogar Novamente</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Desenvolvido para o Projeto Agrinho</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
